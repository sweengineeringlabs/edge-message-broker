[package]
name         = "swe-edge-message-broker"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
rust-version.workspace = true
authors.workspace     = true
repository.workspace  = true
description  = "edge — message broker CONTRACT: runtime-agnostic MessageBroker trait, message/stream/error value types, and config vocabulary. Backends live in swe-edge-runtime."
keywords     = ["message-broker", "pubsub", "contract", "async", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "message-broker"

[lib]
name = "swe_edge_message_broker"
path = "src/lib.rs"

[dependencies]
bytes                  = "1.0"
futures                = "0.3"
serde                  = { version = "1.0", features = ["derive"] }
thiserror              = "1.0"
tracing                = "0.1"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.1.0" }

[dev-dependencies]
tokio    = { version = "1.0", features = ["rt-multi-thread", "macros"] }
futures  = "0.3"
bytes    = "1.0"
tempfile = "3.0"
toml     = "0.8"

[[test]]
name = "noop_message_broker_int_test"
path = "tests/noop_message_broker_int_test.rs"

[[test]]
name = "application_config_builder_int_test"
path = "tests/application_config_builder_int_test.rs"

[[test]]
name = "edge_message_broker_svc_int_test"
path = "tests/edge_message_broker_svc_int_test.rs"

[[test]]
name = "validator_int_test"
path = "tests/validator_int_test.rs"

[[test]]
name = "broker_error_int_test"
path = "tests/broker_error_int_test.rs"

[[test]]
name = "message_int_test"
path = "tests/message_int_test.rs"

[[test]]
name = "message_broker_int_test"
path = "tests/message_broker_int_test.rs"

[[test]]
name = "message_stream_int_test"
path = "tests/message_stream_int_test.rs"

[[test]]
name = "broker_backend_int_test"
path = "tests/broker_backend_int_test.rs"

[[test]]
name = "message_broker_config_int_test"
path = "tests/message_broker_config_int_test.rs"

[[test]]
name = "backend_kind_int_test"
path = "tests/backend_kind_int_test.rs"

[lints]
workspace = true
