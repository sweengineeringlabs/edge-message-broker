[package]
name         = "swe-edge-message-broker"
version      = "0.3.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge-message-broker"
description  = "edge — message broker CONTRACT: runtime-agnostic MessageBroker trait, message/stream/error value types, and config vocabulary. Backends live in swe-edge-runtime."
keywords     = ["message-broker", "pubsub", "contract", "async", "swe"]
categories   = ["network-programming", "asynchronous"]

[package.metadata.struct-engine]
application_type = "lib"
service_type     = "message-broker"

[package.metadata.arch]
application_type = "lib"
service_type     = "message-broker"

[lib]
name = "swe_edge_message_broker"
path = "main/src/lib.rs"

[dependencies]
bytes                  = "1.11"
futures                = "0.3"
serde                  = { version = "1.0", features = ["derive"] }
thiserror              = "2.0"
tracing                = "0.1"
swe-edge-configbuilder = { git = "https://github.com/sweengineeringlabs/edge-configbuilder.git", tag = "v0.4.2" }

[dev-dependencies]
tokio    = { version = "1.52", features = ["rt-multi-thread", "macros"] }
futures  = "0.3"
bytes    = "1.11"
tempfile = "3.27"
toml     = "0.8"

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
